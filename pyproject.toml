[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-serving-platform"
version = "0.1.0"
description = "A layered modular monolith for serving machine learning models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "numpy>=1.26,<3",
    "scikit-learn>=1.4,<2",
    "onnxruntime>=1.20,<2",
    "fastapi>=0.115,<1",
    "starlette>=0.46,<1",
    "pydantic>=2.9,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "onnx>=1.17,<2", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
